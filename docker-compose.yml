services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: scraper
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    ports:
      - "4200:4200"
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: "sqlite+aiosqlite:///prefect.db"
    volumes:
      - prefect_data:/root/.prefect

  minio:
    image: quay.io/minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"  
      - "9101:9001"  
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"


  valhalla:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: valhalla
    volumes:
      - ./valhalla_files:/custom_files
    environment:
      - tile_urls=https://download.geofabrik.de/europe/spain/andalucia-latest.osm.pbf
      - serve_tiles=True
      - use_tiles_ignore_pbf=False
      - force_rebuild=False
      - build_tiles=True              
      - build_tar=True
      - server_threads=1
    restart: unless-stopped

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    restart: unless-stopped


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - valhalla
    environment:
      VALHALLA_URL: http://valhalla:8002
      PGURI: postgresql+asyncpg://postgres:mysecretpassword@postgres:5432/scraper
    
  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    container_name: pipeline-runner
    depends_on:
      - postgres
      - minio
      - prefect-server
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PGURI: postgresql+psycopg2://postgres:mysecretpassword@postgres:5432/scraper
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin 
      MINIO_ENDPOINT: minio:9000

volumes:
  postgres_data:
  minio_data:
  prefect_data:
  valhalla_files:
