[project]
name = "semantic-embeddings-service"
version = "0.1.0"
description = "Embeddings and semantic search-text microservice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "sentence-transformers>=5.0.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.2",
]

[tool.setuptools.packages.find]
where = ["src"]
